                content: `<div class="text-center py-20"><h1 class="text-4xl italic mb-6">Tercera Semana</h1><h2 class="text-2xl mb-6 text-pink-500 font-bold">Gaudete</h2><hr class="w-16 mx-auto border-gray-400 mb-6"/><p class="text-xl">"Estad siempre alegres en el Señor."</p></div>`
            },
            {
                type: 'chapter',
                title: "Día 15: Domingo de Gaudete",
                content: `
                <h4>Lectura: Filipenses 4, 4-5</h4>
                <p class="italic text-sm ml-4 border-l-2 pl-4 border-gray-300">"Estad siempre alegres en el Señor; os lo repito, estad alegres. Que vuestra mesura la conozca todo el mundo. El Señor está cerca."</p>
                
                <h4>Reflexión</h4>
                <p>Hoy el color litúrgico cambia del morado austero al rosa alegre. ¿Cuál es el motivo de esta alegría? No es que nuestros problemas hayan desaparecido. El motivo es una Presencia: "El Señor está cerca".</p>
                <p>La tristeza cristiana es un contrasentido. Un santo triste es un triste santo. Incluso en medio del dolor, el cristiano tiene un fondo de paz y esperanza que nadie le puede arrebatar. Nuestra alegría no depende de "cómo me van las cosas", sino de "con quién estoy".</p>
                
                <h4>Oración</h4>
                <p>Espíritu Santo, fuente de gozo, destierra de mí la tristeza mundana y dame la alegría de los hijos de Dios.</p>
                `
            },
            {
                type: 'chapter',
                title: "Día 16: La Autoridad de Jesús",
                content: `
                <h4>Lectura: Mateo 21, 23-27</h4>
                <p>Jesús enseña con autoridad porque vive lo que predica. En el Adviento, Él viene a reclamar autoridad sobre nuestra vida. No como un tirano, sino como el Pastor legítimo.</p>
                <p>A menudo le decimos a Jesús: "Tú reina en la Iglesia, pero en mi dinero, en mi sexualidad o en mis planes profesionales, mando yo".</p>
                <p>La conversión total implica entregarle las llaves de todas las habitaciones de nuestra vida, incluso de esos cuartos oscuros que no mostramos a nadie. Él quiere entrar allí para limpiar e iluminar.</p>
                `
            },
            {
                type: 'chapter',
                title: "Día 17: Las Antífonas de la O - I",
                content: `
                <h4>Comienzan las Antífonas Mayores</h4>
                <p>Desde el 17 de diciembre, la Iglesia canta con intensidad especial. Son siete invocaciones que empiezan por "Oh".</p>
                
                <div class="mt-6 border p-4 rounded-lg bg-black/5">
                    <h3 class="text-center font-bold">O Sapientia (Oh Sabiduría)</h3>
                    <p class="italic mt-2">"Oh Sabiduría, que brotaste de los labios del Altísimo, abarcando del uno al otro confín, y ordenándolo todo con firmeza y suavidad: ven y muéstranos el camino de la salvación."</p>
                </div>
                
                <h4>Reflexión</h4>
                <p>Pedimos la Sabiduría, que no es saber muchas cosas (erudición), sino "saborear" las cosas de Dios. Ver la vida con los ojos de Dios.</p>
                `
            },
            {
                type: 'chapter',
                title: "Día 18: Las Antífonas de la O - II",
                content: `
                <div class="mt-6 border p-4 rounded-lg bg-black/5">
                    <h3 class="text-center font-bold">O Adonai (Oh Señor Poderoso)</h3>
                    <p class="italic mt-2">"Oh Adonai, Pastor de la casa de Israel, que te apareciste a Moisés en la zarza ardiente... ven a librarnos con el poder de tu brazo."</p>
                </div>
                
                <h4>Reflexión sobre San José</h4>
                <p>Hoy recordamos también a José. Él experimentó el poder de Dios en el silencio. Ante el misterio del embarazo de María, José optó por la caridad y la prudencia antes que por la justicia legalista. Y en sueños, Dios le habló.</p>
                <p>José es el hombre que se fía de Dios incluso cuando todo parece confuso. Es el patrono de la confianza en la Providencia.</p>
                
                <h4>Propósito</h4>
                <p>Rezar un Padrenuestro pidiendo por los padres de familia.</p>
                `
            },
            {
                type: 'chapter',
                title: "Día 19: Las Antífonas de la O - III",
                content: `
                <div class="mt-6 border p-4 rounded-lg bg-black/5">
                    <h3 class="text-center font-bold">O Radix Jesse (Oh Raíz de Jesé)</h3>
                    <p class="italic mt-2">"Oh Raíz de Jesé, que te alzas como un signo para los pueblos... ven a librarnos, no tardes más."</p>
                </div>
                
                <h4>Reflexión: La Esterilidad Fecunda</h4>
                <p>Recordamos hoy a las madres estériles de la Biblia: Sara, Ana, Isabel. De troncos secos, Dios hace brotar vida. Jesé era el padre de David; el tronco parecía muerto, pero de él brota un renuevo: Jesús.</p>
                <p>No hay situación perdida para Dios. Donde tú ves un final, Dios ve un comienzo. Donde tú ves fracaso, Dios prepara una victoria de gracia.</p>
                `
            },
            {
                type: 'chapter',
                title: "Día 20: Las Antífonas de la O - IV",
                content: `
                <div class="mt-6 border p-4 rounded-lg bg-black/5">
                    <h3 class="text-center font-bold">O Clavis David (Oh Llave de David)</h3>
                    <p class="italic mt-2">"Oh Llave de David y Cetro de la casa de Israel; que abres y nadie puede cerrar, cierras y nadie puede abrir: ven y libra a los cautivos que viven en tinieblas y en sombra de muerte."</p>
                </div>
                
                <h4>Reflexión</h4>
                <p>Jesús es la Llave. Solo Él puede abrir la puerta del Cielo y la puerta de nuestro corazón. A veces nos encerramos en prisiones construidas por nosotros mismos: miedo, rencor, vicio.</p>
                <p>Gritemos hoy: ¡Ven, Señor! Abre mis cadenas. Sácame de la cárcel de mi egoísmo.</p>
                `
            },
            {
                type: 'chapter',
                title: "Día 21: Las Antífonas de la O - V",
                content: `
                <div class="mt-6 border p-4 rounded-lg bg-black/5">
                    <h3 class="text-center font-bold">O Oriens (Oh Sol Naciente)</h3>
                    <p class="italic mt-2">"Oh Sol que naces de lo alto, Resplandor de la luz eterna, Sol de justicia: ven ahora a iluminar a los que viven en tinieblas y en sombra de muerte."</p>
                </div>
                
                <h4>Reflexión: El Solsticio</h4>
                <p>En el hemisferio norte, son los días más oscuros del año. Justo cuando la noche parece vencer, la luz comienza a crecer. Cristo es el verdadero Sol invicto.</p>
                <p>La Visitación: María viaja aprisa a la montaña. Lleva al "Sol" en su seno. Su presencia ilumina la casa de Isabel y hace saltar de alegría a Juan. ¿Llevo yo luz a donde voy, o llevo quejas y oscuridad?</p>
                `
            },
            
            // --- SEMANA 4 ---
            {
                type: 'section',
                title: "Semana IV: El Enmanuel",
                content: `<div class="text-center py-20"><h1 class="text-4xl italic mb-6">Cuarta Semana</h1><hr class="w-16 mx-auto border-gray-400 mb-6"/><p class="text-xl">"Todo esto sucedió para que se cumpliera lo que el Señor había anunciado."</p></div>`
            },
            {
                type: 'chapter',
                title: "Día 22: O Rex Gentium",
                content: `
                <div class="mt-6 border p-4 rounded-lg bg-black/5">
                    <h3 class="text-center font-bold">O Rex Gentium (Oh Rey de las Naciones)</h3>
                    <p class="italic mt-2">"Oh Rey de las naciones y Deseado de los pueblos, Piedra angular de la Iglesia, que haces de dos pueblos uno solo: ven y salva al hombre, que formaste del barro de la tierra."</p>
                </div>
                
                <h4>Reflexión: El Magnificat</h4>
                <p>María canta: "Proclama mi alma la grandeza del Señor". Es el canto de los humildes. María no se atribuye nada; todo es don. El Rey de las Naciones elige un trono humilde.</p>
                <p>Aprendamos a dar gracias. El agradecimiento es la memoria del corazón. Haz una lista de 10 gracias recibidas este año antes de que termine.</p>
                `
            },
            {
                type: 'chapter',
                title: "Día 23: O Emmanuel",
                content: `
                <div class="mt-6 border p-4 rounded-lg bg-black/5">
                    <h3 class="text-center font-bold">O Emmanuel (Oh Dios-con-nosotros)</h3>
                    <p class="italic mt-2">"Oh Emmanuel, rey y legislador nuestro, esperanza de las naciones y salvador de los pueblos: ven a salvarnos, Señor Dios nuestro."</p>
                </div>
                
                <h4>Reflexión</h4>
                <p>Es la última antífona. El nombre de Jesús es su misión: Dios salva. El nombre profético es Emmanuel: Dios con nosotros.</p>
                <p>Ya no estamos solos en el universo inmenso. Dios no es una energía cósmica impersonal; es un rostro, un niño, un corazón que late junto al nuestro. Estamos a las puertas. La liturgia contiene la respiración.</p>
                `
            },
            {
                type: 'chapter',
                title: "Día 24: La Noche Santa",
                content: `
                <h3>Víspera de Navidad</h3>
                <p>Ha llegado el momento. El censo de César Augusto mueve la historia para que se cumpla la profecía: en Belén, la menor de las aldeas.</p>
                <p><strong>Meditación de Nochebuena:</strong></p>
                <p>Contempla a José y María buscando posada. Puerta tras puerta se cierra. "No hay lugar". Qué frase tan terrible. ¿Hay lugar en mi vida hoy?</p>
                <p>No preparemos solo la cena y los regalos. Preparemos el alma. Esta noche, cuando beses al Niño Jesús, entrégale todo: tus éxitos y tus fracasos. Él viene a cargarlo todo.</p>
                
                <h4>Oración Familiar</h4>
                <p><em>(Para rezar antes de la cena)</em><br/>"Bendice, Señor, esta mesa y a esta familia. Tú que naciste en la pobreza de Belén, haz que nunca nos falte el pan y que sepamos compartirlo con los necesitados. Amén."</p>
                `
            },
            // --- NAVIDAD ---
            {
                type: 'section',
                title: "TIEMPO DE NAVIDAD",
                content: `<div class="text-center py-20"><h1 class="text-5xl italic font-bold mb-6 text-yellow-600">Navidad</h1><p class="text-2xl mt-4">"Y el Verbo se hizo carne, y habitó entre nosotros."</p></div>`
            },
            {
                type: 'chapter',
                title: "Día 25: El Nacimiento",
                content: `
                <h4>La Palabra se hizo Niño</h4>
                <p>¡Feliz Navidad! No es una frase hecha. Es la realidad más bella de la historia. Dios se ha hecho uno de nosotros.</p>
                <p>San León Magno exclama: "¡Reconoce, cristiano, tu dignidad!". Si Dios ha querido hacerse hombre, la vida humana tiene un valor infinito. Nadie es despreciable, porque Dios ha asumido el rostro humano.</p>
                <p>Hoy no pidas nada. Solo adora. Como los pastores, quédate en silencio ante el misterio. Deja que la ternura de Dios te desarme. Dios se hace débil para que no tengamos miedo de amarlo.</p>
                `
            },
            {
                type: 'chapter',
                title: "La Octava: Días 26-28",
                content: `
                <h4>La Fiesta Continúa</h4>
                <p>La Iglesia celebra la "Octava de Navidad". Ocho días que son como un solo día de júbilo.</p>
                <ul class="list-disc pl-5 space-y-4 mt-4">
                    <li><strong>26 de Dic - San Esteban:</strong> El primer mártir. La Navidad trae la Cruz. El amor a Cristo es más fuerte que la muerte.</li>
                    <li><strong>27 de Dic - San Juan Evangelista:</strong> El discípulo amado. El que recostó su cabeza en el pecho de Jesús en la Cena, ahora contempla al Niño. Es el apóstol del Amor.</li>
                    <li><strong>28 de Dic - Santos Inocentes:</strong> Recordamos a los niños que murieron por Cristo en lugar de Cristo. Oramos por la vida naciente amenazada hoy.</li>
                </ul>
                `
            },
            {
                type: 'chapter',
                title: "La Sagrada Familia",
                content: `
                <h4>Domingo de la Sagrada Familia</h4>
                <p>Dios no quiso venir como un superhéroe solitario, sino en el seno de una familia humana. Santificó los vínculos familiares.</p>
                <p>Jesús creció en sabiduría, estatura y gracia, obedeciendo a María y a José. La familia es la "iglesia doméstica", la primera escuela de virtudes.</p>
                <p>Hoy rezamos por todas las familias, especialmente las que pasan por dificultades, división o enfermedad. Que Nazaret sea modelo de todo hogar cristiano.</p>
                `
            },
            {
                type: 'chapter',
                title: "Santa María, Madre de Dios",
                content: `
                <h4>1 de Enero</h4>
                <p>Comenzamos el año civil de la mejor manera: en brazos de la Madre. El título más antiguo y grande de la Virgen es <em>Theotokos</em>, Madre de Dios.</p>
                <p>Ella nos entrega a Jesús. No lo guarda para sí. Al comenzar este nuevo año, nos ponemos bajo su manto. Que ella nos enseñe a "guardar todas estas cosas en el corazón", meditándolas día a día.</p>
                <p>¡Feliz Año Nuevo en el Señor!</p>
                `
            },
            {
                type: 'chapter',
                title: "Epílogo y Bendición",
                content: `
                <h3>Envío Final</h3>
                <p>Hemos llegado al final de este libro, pero es solo el comienzo del camino. El Adviento y la Navidad nos han recargado las pilas espirituales para vivir el resto del año como hijos de la Luz.</p>
                <p>Recuerda: El cristianismo no es una teoría, es un encuentro. Mantén vivo el encuentro con Cristo en la Eucaristía, en la oración diaria y en el servicio a los hermanos.</p>
                <br/>
                <p class="text-center font-bold italic">"Gloria a Dios en el cielo,<br/>y en la tierra paz a los hombres que ama el Señor."</p>
                <br/><br/>
                <div class="text-center text-sm text-gray-500">
                    <p>Fin de la Edición Digital</p>
                    <p>Laus Deo</p>
                </div>
                `
            }
        ];

        function KindleReader() {
            const [currentPage, setCurrentPage] = useState(0);
            const [theme, setTheme] = useState('sepia'); 
            const [fontSize, setFontSize] = useState(18); 
            const [showMenu, setShowMenu] = useState(false);
            const [showSettings, setShowSettings] = useState(false);

            // Scroll to top on page turn
            const contentRef = useRef(null);

            useEffect(() => {
                if (contentRef.current) {
                    contentRef.current.scrollTop = 0;
                }
            }, [currentPage]);

            const totalPages = bookData.length;
            const currentData = bookData[currentPage];

            const handleNext = () => {
                if (currentPage < totalPages - 1) setCurrentPage(prev => prev + 1);
            };

            const handlePrev = () => {
                if (currentPage > 0) setCurrentPage(prev => prev - 1);
            };

            const goToPage = (index) => {
                setCurrentPage(index);
                setShowMenu(false);
            };

            const themes = {
                light: { bg: 'bg-white', text: 'text-gray-900', ui: 'bg-gray-100', accent: 'text-blue-600' },
                sepia: { bg: 'bg-[#f4ecd8]', text: 'text-[#5b4636]', ui: 'bg-[#e9dec0]', accent: 'text-[#8c3b00]' },
                dark: { bg: 'bg-[#1a1a1a]', text: 'text-[#cecece]', ui: 'bg-[#2a2a2a]', accent: 'text-blue-400' }
            };
            
            const currentTheme = themes[theme];
            const progress = Math.round(((currentPage + 1) / totalPages) * 100);

            return (
                <div className={`h-screen w-full flex flex-col items-center justify-center ${currentTheme.bg} transition-colors duration-300 overflow-hidden font-serif select-none`}>
                
                {/* HEADER */}
                <div className={`w-full h-14 flex items-center justify-between px-4 border-b ${theme === 'dark' ? 'border-gray-700' : 'border-gray-300/50'} z-10`}>
                    <div className="flex items-center gap-3">
                    <button onClick={() => setShowMenu(true)} className={`p-2 rounded-full hover:bg-black/5 ${currentTheme.text}`}>
                        <MenuIcon size={24} />
                    </button>
                    <span className={`text-sm font-semibold uppercase tracking-widest ${currentTheme.text} opacity-70 hidden sm:block truncate max-w-[200px]`}>
                        {currentData.type === 'cover' ? '' : currentData.title}
                    </span>
                    </div>
                    
                    <div className="flex items-center gap-2">
                    <button onClick={() => setShowSettings(!showSettings)} className={`p-2 rounded-full hover:bg-black/5 ${currentTheme.text}`}>
                        <TypeIcon size={24} />
                    </button>
                    </div>
                </div>

                {/* SETTINGS POPUP */}
                {showSettings && (
                    <div className={`absolute top-16 right-4 w-64 p-4 rounded-xl shadow-2xl z-50 border ${theme === 'dark' ? 'bg-[#2a2a2a] border-gray-600' : 'bg-white border-gray-200'}`}>
                    <div className="flex flex-col gap-4">
                        <div className="flex items-center justify-between px-2">
                        <TypeIcon size={16} className={theme === 'dark' ? 'text-white' : 'text-black'} />
                        <div className="flex items-center gap-3 bg-gray-200/20 rounded-lg p-1">
                            <button onClick={() => setFontSize(Math.max(14, fontSize - 2))} className="p-2 hover:bg-black/10 rounded">-</button>
                            <span className={theme === 'dark' ? 'text-white' : 'text-black'}>{fontSize}</span>
                            <button onClick={() => setFontSize(Math.min(32, fontSize + 2))} className="p-2 hover:bg-black/10 rounded">+</button>
                        </div>
                        <TypeIcon size={24} className={theme === 'dark' ? 'text-white' : 'text-black'} />
                        </div>
                        <hr className="opacity-20" />
                        <div className="flex justify-between gap-2">
                        <button onClick={() => setTheme('light')} className={`flex-1 py-2 rounded border ${theme === 'light' ? 'ring-2 ring-blue-500' : 'border-gray-300'} bg-white text-black text-xs font-sans`}>Aa</button>
                        <button onClick={() => setTheme('sepia')} className={`flex-1 py-2 rounded border ${theme === 'sepia' ? 'ring-2 ring-blue-500' : 'border-[#e0d6c2]'} bg-[#f4ecd8] text-[#5b4636] text-xs font-sans`}>Aa</button>
                        <button onClick={() => setTheme('dark')} className={`flex-1 py-2 rounded border ${theme === 'dark' ? 'ring-2 ring-blue-500' : 'border-gray-700'} bg-[#1a1a1a] text-white text-xs font-sans`}>Aa</button>
                        </div>
                    </div>
                    </div>
                )}

                {/* TOC DRAWER */}
                {showMenu && (
                    <div className="absolute inset-0 z-50 flex">
                    <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setShowMenu(false)}></div>
                    <div className={`w-80 h-full ${theme === 'dark' ? 'bg-[#2a2a2a] text-gray-200' : 'bg-white text-gray-800'} shadow-2xl flex flex-col transform transition-transform`}>
                        <div className="p-4 border-b flex justify-between items-center">
                        <h2 className="font-bold text-lg font-sans">Índice</h2>
                        <button onClick={() => setShowMenu(false)}><XIcon size={24} /></button>
                        </div>
                        <div className="overflow-y-auto flex-1 p-2">
                        {bookData.map((page, idx) => (
                            <button 
                            key={idx} 
                            onClick={() => goToPage(idx)}
                            className={`w-full text-left p-3 rounded-lg text-sm mb-1 truncate font-sans ${currentPage === idx ? 'bg-blue-500 text-white' : 'hover:bg-black/5'}`}
                            >
                            <span className="font-bold opacity-50 mr-2">{idx + 1}.</span>
                            {page.title}
                            </button>
                        ))}
                        </div>
                    </div>
                    </div>
                )}

                {/* READER CONTENT */}
                <div 
                    ref={contentRef}
                    className="flex-1 w-full max-w-3xl px-6 py-6 sm:px-16 sm:py-12 overflow-y-auto custom-scrollbar"
                    style={{ scrollBehavior: 'smooth' }}
                >
                    <div className={`max-w-2xl mx-auto transition-opacity duration-500 ${currentTheme.text}`} style={{ fontSize: `${fontSize}px`, lineHeight: '1.8' }}>
                    
                    {currentData.type === 'cover' ? (
                        <div className="flex flex-col items-center justify-center min-h-[60vh] py-10 text-center border-4 double-border p-8 border-current rounded-sm">
                        {currentData.image ? (
                            <img 
                            src={currentData.image} 
                            alt="Cover" 
                            className="w-48 h-auto mb-8 rounded shadow-md object-cover"
                            />
                        ) : (
                            <BookOpen size={80} strokeWidth={1} className="mb-8 opacity-80" />
                        )}
                        <h1 className="text-4xl sm:text-6xl font-serif font-bold mb-6 tracking-tight leading-tight">{currentData.title}</h1>
                        <p className="text-xl sm:text-2xl font-light italic mb-12 opacity-80">{currentData.subtitle}</p>
                        <div className="mt-auto pt-10 border-t border-current/20 w-full">
                            <p className="text-sm font-sans uppercase tracking-widest opacity-60">{currentData.author}</p>
                        </div>
                        </div>
                    ) : currentData.type === 'section' ? (
                        <div className="flex flex-col items-center justify-center min-h-[50vh] animate-fade-in" dangerouslySetInnerHTML={{ __html: currentData.content }} />
                    ) : (
                        <div className="animate-fade-in pb-20">
                        <div className="flex items-baseline justify-between border-b border-current/20 pb-4 mb-8">
                            <h2 className={`text-3xl font-bold ${currentTheme.accent}`}>{currentData.title}</h2>
                        </div>
                        <div className="text-justify font-serif space-y-4" dangerouslySetInnerHTML={{ __html: currentData.content }} />
                        <div className="flex justify-center mt-16 mb-8 opacity-30">
                            <span>• • •</span>
                        </div>
                        </div>
                    )}
                    </div>
                </div>

                {/* FOOTER */}
                <div className={`w-full h-16 border-t flex items-center justify-between px-4 sm:px-12 ${theme === 'dark' ? 'border-gray-700 bg-[#2a2a2a]' : 'border-gray-300/50 bg-white/50 backdrop-blur'}`}>
                    <div className="absolute bottom-0 left-0 h-1 bg-blue-500 transition-all duration-300" style={{ width: `${progress}%` }}></div>

                    <button 
                    onClick={handlePrev} 
                    disabled={currentPage === 0}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-all ${currentPage === 0 ? 'opacity-30 cursor-not-allowed' : `hover:bg-black/5 ${currentTheme.text}`}`}
                    >
                    <ChevronLeft size={20} />
                    <span className="hidden sm:inline text-sm font-medium font-sans">Anterior</span>
                    </button>

                    <span className={`text-xs sm:text-sm font-mono opacity-60 ${currentTheme.text}`}>
                    {currentPage + 1} / {totalPages}
                    </span>

                    <button 
                    onClick={handleNext} 
                    disabled={currentPage === totalPages - 1}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-all ${currentPage === totalPages - 1 ? 'opacity-30 cursor-not-allowed' : `hover:bg-black/5 ${currentTheme.text}`}`}
                    >
                    <span className="hidden sm:inline text-sm font-medium font-sans">Siguiente</span>
                    <ChevronRight size={20} />
                    </button>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KindleReader />);
    </script>
</body>
</html>
